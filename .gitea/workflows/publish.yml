# Publish to the public GitHub repository as a snapshot: the tree of the dispatched commit
# becomes one new commit on GitHub's main (the first one has no parent), so the internal
# history never leaves this server. With `tag`, the commit is tagged there and the Gitea
# release of that tag (notes + .apkg assets) is copied to a GitHub release.
#
# Secret GH_MIRROR_TOKEN: fine-grained GitHub token, Contents read/write on the repository.
name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (empty: code only)"
        required: false
        default: ""
      message:
        description: "Commit message on GitHub"
        required: true
        default: "Countries of the World (COTW)"

env:
  GITHUB_REPO: Parapoxvirus/cotw
  AUTHOR_NAME: Parapoxvirus
  AUTHOR_EMAIL: 112774082+Parapoxvirus@users.noreply.github.com

jobs:
  publish:
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Push the snapshot commit
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          TAG: ${{ inputs.tag }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="https://github.com/$GITHUB_REPO.git"
          export GIT_AUTHOR_NAME="$AUTHOR_NAME" GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL"
          export GIT_COMMITTER_NAME="$AUTHOR_NAME" GIT_COMMITTER_EMAIL="$AUTHOR_EMAIL"
          tree=$(git rev-parse 'HEAD^{tree}')
          if git -c http.extraHeader="$auth" fetch -q --depth 1 "$remote" main 2>/dev/null; then
            if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$tree" ]; then
              commit=$(git rev-parse FETCH_HEAD)
              echo "GitHub main already has this tree"
            else
              commit=$(git commit-tree "$tree" -p FETCH_HEAD -m "$MESSAGE")
            fi
          else
            commit=$(git commit-tree "$tree" -m "$MESSAGE")
          fi
          git -c http.extraHeader="$auth" push -q "$remote" "$commit:refs/heads/main"
          if [ -n "$TAG" ]; then
            git -c http.extraHeader="$auth" push -q "$remote" "$commit:refs/tags/$TAG"
          fi
          echo "GitHub main: $commit"
      - name: Copy the release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GITEA_TOKEN: ${{ github.token }}
          GITEA_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          node - <<'JS'
          const { TAG, GH_TOKEN, GITEA_TOKEN, GITEA_API, GITHUB_REPO } = process.env;
          const gitea = { Authorization: `token ${GITEA_TOKEN}` };
          const gh = { Authorization: `Bearer ${GH_TOKEN}`, Accept: "application/vnd.github+json" };
          const ok = async (r) => { if (!r.ok) throw new Error(`${r.status} ${r.url}: ${await r.text()}`); return r; };
          (async () => {
            const src = await (await ok(await fetch(`${GITEA_API}/releases/tags/${TAG}`, { headers: gitea }))).json();
            let rel = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/tags/${TAG}`, { headers: gh });
            rel = rel.status === 404
              ? await (await ok(await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases`, {
                  method: "POST", headers: gh,
                  body: JSON.stringify({ tag_name: TAG, name: src.name, body: src.body, prerelease: src.prerelease }),
                }))).json()
              : await (await ok(rel)).json();
            const have = new Set(rel.assets.map((a) => a.name));
            for (const a of src.assets) {
              if (have.has(a.name)) { console.log(`${a.name}: already there`); continue; }
              const data = Buffer.from(await (await ok(await fetch(a.browser_download_url, { headers: gitea }))).arrayBuffer());
              const url = rel.upload_url.replace(/\{.*\}$/, "") + `?name=${encodeURIComponent(a.name)}`;
              await ok(await fetch(url, { method: "POST", headers: { ...gh, "Content-Type": "application/octet-stream" }, body: data }));
              console.log(`${a.name}: uploaded (${data.length} bytes)`);
            }
            console.log(rel.html_url);
          })().catch((e) => { console.error(e.message); process.exit(1); });
          JS
