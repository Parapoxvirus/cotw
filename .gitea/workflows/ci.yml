name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install system Python
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 python3-venv >/dev/null
      - name: Install package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -e ".[dev,fetch]"
      - name: Validate data
        run: .venv/bin/python -m cotw validate
      - name: Run tests
        run: .venv/bin/python -m pytest -q
      - name: Run JS tests (globe)
        run: node --test tests/js/*.test.js
      - name: Build the decks
        run: |
          git config --global --add safe.directory "$PWD"
          .venv/bin/python -m cotw build-deck
