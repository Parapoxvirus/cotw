# Wanted languages and their sources.
#
# The curated list of locales COTW may be translated into, with the sources every locale reads
# from: its Wikipedia and its Wikidata label languages. It is the single source for both; a
# locale is added here before its module (docs/TRANSLATING.md). An entry here is a wish, not a
# published deck. Loaded and checked by tools/cotw/locales.py (`python -m cotw validate`).
#
# Fields:
#   tag            BCP 47 language tag in canonical case (`pt-BR`), unique.
#   endonym        The locale's name in its own language, as a standalone label. The region or
#                  script is added in parentheses only when the list has another locale of the
#                  same language.
#   english        The same name in English.
#   wiki           Wikidata site ID of the locale's Wikipedia (`ptwiki`).
#   wikipedia      Article URL prefix, `https://…/`; the article title is appended. A script
#                  variant pins the Wikipedia's variant path (`/zh-hant/`, `/sr-el/`).
#   wikidata       Wikidata label languages in fallback order: the first one with a label wins.
#                  A fallback never crosses scripts.
#   naming_source  Optional: the official list the country and capital names follow (title,
#                  publisher, url). Where it is not known yet, it is left out.
#
# Shape: `language(-Script)?-REGION`. The region is an ISO 3166-1 alpha-2 code or a UN M49
# area code (`es-419`). A script subtag only where the language is written in more than one
# script (`zh-Hans-CN`, `sr-Latn-RS`). A pan-regional standard language takes the CLDR region
# (`ar-001`). A deviation from these rules gets a comment at its entry.
#
# Naming sources: EN, DE and PL as in docs/TRANSLATING.md; the other EU languages the
# Interinstitutional Style Guide, Annex A5, in that language; Arabic, Chinese and Russian UNTERM.
#
# Sorted by tag.

# Modern Standard Arabic is not tied to one country: the CLDR region 001 (World).
